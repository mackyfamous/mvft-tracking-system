<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        padding: 20px;
        color: #202124;
        background: #ffffff;
        font-size: 14px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 700;
      }

      form {
        display: grid;
        gap: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      label {
        display: block;
        font-weight: 700;
      }

      label input,
      label select,
      label textarea {
        margin-top: 6px;
      }

      input,
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #dadce0;
        border-radius: 6px;
        padding: 9px 10px;
        color: #202124;
        font: 14px Arial, sans-serif;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      .meta {
        display: none;
        padding: 10px 12px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #f8fafd;
        font-weight: 700;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 6px;
      }

      button {
        border: 1px solid #1a73e8;
        border-radius: 6px;
        padding: 9px 14px;
        font: 700 14px Arial, sans-serif;
        cursor: pointer;
      }

      button[type="button"] {
        color: #1a73e8;
        background: #ffffff;
      }

      button[type="submit"] {
        color: #ffffff;
        background: #1a73e8;
      }

      button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .status {
        min-height: 20px;
        color: #188038;
        font-weight: 700;
      }

      .status.error {
        color: #b3261e;
      }

      .required-star {
        color: #ea4335;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Task</h1>
    <div class="meta" id="task-meta"></div>

    <form id="task-form">
      <input type="hidden" name="mode">
      <input type="hidden" name="rowNumber">

      <datalist id="members"></datalist>

      <div class="grid">
        <label>
          Created by <span class="required-star">*</span>
          <select name="createdBy" required></select>
        </label>
        <label>
          Created by email <span class="required-star">*</span>
          <input name="createdByEmail" type="email" required>
        </label>
      </div>

      <label>
        Task title <span class="required-star">*</span>
        <input name="title" required>
      </label>

      <label>
        Description (Optional)
        <textarea name="description"></textarea>
      </label>

      <div class="grid">
        <label>
          Priority <span class="required-star">*</span>
          <select name="priority" required></select>
        </label>
        <label>
          Status <span class="required-star">*</span>
          <select name="status" required></select>
        </label>
      </div>

      <div class="grid">
        <label>
          Assignee <span class="required-star">*</span>
          <input name="assignee" list="members" autocomplete="off" required>
        </label>
        <label>
          Assignee email <span class="required-star">*</span>
          <input name="assigneeEmail" type="email" required>
        </label>
      </div>

      <label>
        Due date <span class="required-star">*</span>
        <input name="dueDate" type="date" required>
      </label>

      <label>
        Notes (Optional)
        <textarea name="notes"></textarea>
      </label>

      <div class="status" id="status"></div>

      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="submit">Save task</button>
      </div>
    </form>

    <script>
      const DATA = <?!= data ?>;
      const currentUser = DATA.currentUser || {};
      const members = mergeMembers(DATA.members || [], currentUser);

      function normalize(value) {
        return String(value || '').trim().toLowerCase();
      }

      function mergeMembers(memberList, user) {
        const merged = [];
        const seen = {};

        function addMember(member) {
          const name = String(member.name || '').trim();
          const email = String(member.email || '').trim();
          const key = normalize(email) || normalize(name);
          if ((!name && !email) || seen[key]) {
            return;
          }

          seen[key] = true;
          merged.push({
            name: name || email,
            email,
          });
        }

        addMember(user || {});
        memberList.forEach(addMember);

        return merged;
      }

      function findMemberByName(name) {
        const val = String(name || '').trim();
        return members.find((member) => normalize(member.name) === normalize(val));
      }

      function setField(name, value) {
        document.querySelector(`[name="${name}"]`).value = value || '';
      }

      function fillSelect(name, options, selected) {
        const select = document.querySelector(`[name="${name}"]`);
        select.innerHTML = '';
        options.forEach((optionValue) => {
          const option = document.createElement('option');
          option.value = optionValue;
          option.textContent = optionValue;
          if (normalize(optionValue) === normalize(selected)) {
            option.selected = true;
          }
          select.appendChild(option);
        });
      }

      function fillMemberSelect(name, selectedName, selectedEmail) {
        const select = document.querySelector(`[name="${name}"]`);

        let effName = selectedName;
        let effEmail = selectedEmail;

        if (!normalize(effName) && !normalize(effEmail) && members.length > 0) {
          effName = members[0].name;
          effEmail = members[0].email;
        }

        const options = mergeMembers(
          [
            {
              name: effName,
              email: effEmail,
            },
            ...members,
          ],
          {}
        );

        select.innerHTML = '';

        if (options.length === 0) {
          return;
        }

        options.forEach((member, index) => {
          const option = document.createElement('option');
          option.value = member.name;
          option.textContent = member.email ? `${member.name} (${member.email})` : member.name;
          option.dataset.email = member.email || '';
          if (
            index === 0 ||
            (effName && normalize(member.name) === normalize(effName)) ||
            (effEmail && normalize(member.email) === normalize(effEmail))
          ) {
            option.selected = true;
          }
          select.appendChild(option);
        });

        hydrateEmail(name, name === 'createdBy' ? 'createdByEmail' : 'assigneeEmail');
      }

      function fillMembers() {
        const datalist = document.getElementById('members');
        datalist.innerHTML = '';
        members.forEach((member) => {
          const option = document.createElement('option');
          option.value = member.name;
          option.label = member.email;
          datalist.appendChild(option);
        });
      }

      function hydrateEmail(nameField, emailField) {
        const nameInput = document.querySelector(`[name="${nameField}"]`);
        const emailInput = document.querySelector(`[name="${emailField}"]`);

        if (nameInput.tagName === 'SELECT') {
          const selectedOption = nameInput.options[nameInput.selectedIndex];
          if (selectedOption && selectedOption.dataset.email) {
            emailInput.value = selectedOption.dataset.email;
            return;
          }
        }

        const member = findMemberByName(nameInput.value);
        if (member && member.email) {
          emailInput.value = member.email;
        } else {
          emailInput.value = '';
        }
      }

      function collectForm() {
        const data = {};
        new FormData(document.getElementById('task-form')).forEach((value, key) => {
          data[key] = value;
        });
        return data;
      }

      function setBusy(isBusy) {
        document.getElementById('submit').disabled = isBusy;
        document.getElementById('cancel').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = isError ? 'status error' : 'status';
      }

      function submitTask(event) {
        event.preventDefault();
        setBusy(true);
        setStatus('Saving task...', false);

        google.script.run
          .withSuccessHandler((result) => {
            setStatus(result.message || 'Task saved.', false);
            setTimeout(() => google.script.host.close(), 700);
          })
          .withFailureHandler((error) => {
            setBusy(false);
            setStatus(error.message || 'Unable to save task.', true);
          })
          .submitTaskForm(collectForm());
      }

      function initialize() {
        const task = DATA.task || {};
        const isAdd = DATA.mode === 'add';
        document.getElementById('title').textContent = isAdd ? 'Add task' : 'Update task';
        document.querySelector('[name="mode"]').value = DATA.mode || 'add';
        document.querySelector('[name="rowNumber"]').value = DATA.rowNumber || '';

        if (!isAdd) {
          const meta = document.getElementById('task-meta');
          meta.textContent = `Editing ${task.taskId || `row ${DATA.rowNumber}`}`;
          meta.style.display = 'block';
        }

        fillMembers();
        fillMemberSelect('createdBy', task.createdBy, task.createdByEmail);
        fillSelect('priority', DATA.priorities || [], task.priority);
        fillSelect('status', DATA.statuses || [], task.status);

        setField('createdByEmail', task.createdByEmail);
        setField('title', task.title);
        setField('description', task.description);
        setField('assignee', task.assignee);
        setField('assigneeEmail', task.assigneeEmail);
        setField('dueDate', task.dueDate);
        setField('notes', task.notes);

        document.querySelector('[name="createdBy"]').addEventListener('change', () => {
          hydrateEmail('createdBy', 'createdByEmail');
        });
        hydrateEmail('createdBy', 'createdByEmail');

        const assigneeInput = document.querySelector('[name="assignee"]');
        assigneeInput.addEventListener('input', () => {
          hydrateEmail('assignee', 'assigneeEmail');
        });
        assigneeInput.addEventListener('change', () => {
          hydrateEmail('assignee', 'assigneeEmail');
        });

        document.getElementById('task-form').addEventListener('submit', submitTask);
        document.getElementById('cancel').addEventListener('click', () => google.script.host.close());
      }

      initialize();
    </script>
  </body>
</html>
